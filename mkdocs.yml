site_name: AGILAB Software Lab Guide
site_description: Centralized software development and research guidelines for AGILAB.
site_url: https://agilab-ntnu.github.io/AGILAB_Software_Lab_Guide/

theme:
  name: material
  language: zh-TW
  palette:
    # Day mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Night mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - 'English Manual':
    - 'Home': 'en/index.md'
    - 'Getting Started': 'en/contributing.md'
    - 'Reproducibility': 'en/reproducibility.md'
    - 'Environment': 'en/conda_guide.md'
    - 'Lifecycle': 'en/lifecycle.md'
  - '繁體中文手冊':
    - '首頁': 'zh/index.md'
    - '快速啟動': 'zh/contributing.md'
    - '研究可重現性': 'zh/reproducibility.md'
    - '環境管理': 'zh/conda_guide.md'
    - '專案生命週期': 'zh/lifecycle.md'

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
